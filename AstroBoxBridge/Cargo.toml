[package]
name = "mirage-astrobox"
version = "0.1.0"
edition = "2024"
publish = false
description = "C ABI bridge that lets Mirage drive the companion core against an emulated band"

[lib]
name = "mirage_astrobox"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# Real AstroBox source tree (AstroBox-NG) rather than the Mirage
# `External/AstroBox` submodule pins: the CPC2 26/27/28 resource staging and
# the Canopus ABI 2.0 alignment live in this working tree, and the submodules
# are still pinned at revisions without them.
corelib = { path = "../../AstroBox-NG/src-tauri/modules/core" }
bluetooth = { path = "../../AstroBox-NG/src-tauri/modules/bluetooth" }
pb = { path = "../../AstroBox-NG/src-tauri/modules/pb" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

# Standalone: never join a parent workspace.
[workspace]

[profile.release]
panic = "unwind"

# frontbridge (pulled in by `bluetooth`) resolves its Linux-only
# `../../vendor/tauri-runtime-cef` dependency inside the AstroBox-NG tree.
