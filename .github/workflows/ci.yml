name: CI

on:
  push:
    branches: [main, cross-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # qemu-system-arm.exe with its MinGW DLLs and keymaps
  qemu-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out qemu-miwear
        shell: pwsh
        run: git submodule update --init --depth 1 External/qemu-miwear
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils
          pacboy: >-
            gcc:p glib2:p pixman:p python:p meson:p ninja:p pkgconf:p
      - name: Build QEMU
        run: Scripts/build-qemu-windows.sh "$GITHUB_WORKSPACE/.build/windows/qemu"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-windows
          path: .build/windows/qemu

  windows:
    runs-on: windows-latest
    needs: qemu-windows
    defaults:
      run:
        # bash is not supported by gha-setup-swift on Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the AstroBox modules
        run: git submodule update --init --depth 1 External/AstroBox/modules/core External/AstroBox/modules/bluetooth External/AstroBox/modules/frontbridge External/AstroBox/modules/pb External/AstroBox/modules/vivo_msgpack External/AstroBox/plugins/btclassic-spp
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - name: Swift version
        run: swift --version
      - name: Companion core
        run: Scripts/build-companion-core.ps1
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build Mirage
        run: swift build -c release --product Mirage
      - uses: actions/download-artifact@v4
        with:
          name: qemu-windows
          path: dist/Mirage/qemu
      - name: Package
        run: |
          $dist = "dist/Mirage"
          $bin = swift build -c release --show-bin-path
          Copy-Item "$bin/Mirage.exe" "$dist/"
          Get-ChildItem $bin -Directory -Filter '*.resources' | Copy-Item -Destination $dist -Recurse
          # Swift runtime (swiftCore, Foundation, dispatch, ...) next to the exe
          $runtime = Split-Path (Get-Command swiftCore.dll -ErrorAction SilentlyContinue).Source
          if (-not $runtime) {
            $runtime = Get-ChildItem "$env:LOCALAPPDATA/Programs/Swift/Runtimes" -Recurse -Filter swiftCore.dll | Select-Object -First 1 | Split-Path
          }
          Copy-Item "$runtime/*.dll" $dist
          # WinUI needs the Windows App Runtime 1.5; the app installs it on first launch
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.5/1.5.250108004/windowsappruntimeinstall-x64.exe" -OutFile "$dist/WindowsAppRuntimeInstaller.exe"
          Get-ChildItem $dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-windows-x64
          path: dist

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.1"
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build Mirage (GTK)
        run: swift build --product Mirage

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the AstroBox modules
        run: git submodule update --init --depth 1 External/AstroBox/modules/core External/AstroBox/modules/bluetooth External/AstroBox/modules/frontbridge External/AstroBox/modules/pb External/AstroBox/modules/vivo_msgpack External/AstroBox/plugins/btclassic-spp
      - name: Install GTK 4
        run: brew install gtk4
      - name: Companion core
        run: Scripts/build-companion-core.sh
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build the GTK preview of the Windows/Linux UI
        run: swift build --product Mirage
